	<style>
		:root {
			color-scheme: dark;
			--bg: #10141d;
			--panel: #181e2b;
			--line: #2d374a;
			--text: #e7edf8;
			--muted: #aab7cf;
			--accent: #71a9ff;
			--ok: #65d39b;
			--error: #ff8989
		}

		* {
			box-sizing: border-box
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif
		}

		main {
			max-width: 1440px;
			margin: auto;
			padding: 30px
		}

		h1 {
			margin: 0;
			font-size: 26px
		}

		header p {
			color: var(--muted);
			margin: 6px 0 24px
		}

		#drop {
			border: 2px dashed #476385;
			border-radius: 12px;
			background: var(--panel);
			padding: 34px;
			text-align: center;
			transition: .15s
		}

		#drop.drag {
			background: #202d42;
			border-color: var(--accent)
		}

		input[type="file"] {
			display: none
		}

		#row-jump {
			display: inline-block;
			width: 92px;
			margin-left: 5px;
			background: #202939;
			color: var(--text);
			border: 1px solid #43536d;
			border-radius: 6px;
			padding: 7px 8px
		}

		.button {
			display: inline-block;
			cursor: pointer;
			background: var(--accent);
			color: #081323;
			padding: 9px 14px;
			border-radius: 7px;
			font-weight: 700
		}

		.hint,
		#status {
			color: var(--muted);
			margin: 12px 0 0
		}

		.title {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.logo {
			width: 32px;
			height: 32px;
			flex: none;
		}

		#status.ok {
			color: var(--ok)
		}

		#status.error {
			color: var(--error)
		}

		#summary {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			gap: 1px;
			background: var(--line);
			margin: 24px 0;
			border: 1px solid var(--line);
			border-radius: 8px;
			overflow: hidden
		}

		.fact {
			background: var(--panel);
			padding: 11px
		}

		.fact span {
			display: block;
			color: var(--muted);
			font-size: 12px
		}

		.fact strong {
			display: block;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis
		}

		section {
			margin-top: 26px
		}

		h2 {
			font-size: 17px;
			margin: 0 0 10px
		}

		.scroll {
			overflow: auto;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel);
			max-height: 530px
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
			font-size: 12px
		}

		th,
		td {
			padding: 8px 10px;
			text-align: left;
			border-bottom: 1px solid var(--line);
			white-space: nowrap;
			max-width: 480px;
			overflow: hidden;
			text-overflow: ellipsis
		}

		th {
			position: sticky;
			top: 0;
			background: #202939;
			color: #c9d9f4
		}

		tr:last-child td {
			border: 0
		}

		.rownum {
			color: var(--muted)
		}

		#pager {
			display: flex;
			align-items: center;
			gap: 9px;
			margin-top: 10px
		}

		button,
		select {
			background: #202939;
			color: var(--text);
			border: 1px solid #43536d;
			border-radius: 6px;
			padding: 7px 10px
		}

		button:disabled {
			opacity: .45
		}

		@media(max-width:600px) {
			main {
				padding: 18px
			}

			#drop {
				padding: 25px 12px
			}
		}

		#tabs {
			display: flex;
			gap: 6px;
			overflow-x: auto;
			margin: 14px 0 0;
			padding-bottom: 2px
		}

		.tab {
			display: flex;
			align-items: center;
			gap: 7px;
			max-width: 260px;
			background: #202939;
			color: var(--muted);
			border: 1px solid #43536d;
			border-radius: 7px;
			padding: 7px 9px;
			cursor: pointer
		}

		.tab.active {
			background: #263a59;
			border-color: var(--accent);
			color: var(--text)
		}

		.tab-name {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap
		}

		.tab-close {
			border: 0;
			padding: 0 2px;
			color: inherit;
			background: transparent;
			font-size: 17px;
			line-height: 1;
			cursor: pointer
		}

		#memory-note {
			color: var(--muted);
			font-size: 12px;
			margin: 8px 0 0
		}

		.loading::before {
			content: "";
			display: inline-block;
			width: 12px;
			height: 12px;
			margin-right: 8px;
			vertical-align: -2px;
			border: 2px solid currentColor;
			border-right-color: transparent;
			border-radius: 50%;
			animation: spin .65s linear infinite
		}

		@keyframes spin {
			to {
				transform: rotate(360deg)
			}
		}

		.type-badge {
			display: block;
			width: max-content;
			max-width: 100%;
			margin-top: 3px;
			padding: 1px 5px;
			border: 1px solid #536883;
			border-radius: 999px;
			color: #a9c8f4;
			font: 10px/1.35 system-ui, sans-serif;
			overflow: hidden;
			text-overflow: ellipsis
		}

		.null-value,
		.empty-value {
			font-style: italic;
			font-family: system-ui, sans-serif;
			font-size: 11px;
			border-radius: 4px;
			padding: 2px 5px
		}

		.null-value {
			color: #ffb0b0;
			background: #3a242c
		}

		.empty-value {
			color: #d5c49a;
			background: #342f23
		}

		#copy-csv.copied {
			border-color: var(--ok);
			color: var(--ok)
		}

		#pager label {
			white-space: nowrap
		}

		.section-title {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 0 0 10px
		}

		.section-title h2 {
			margin: 0
		}

		.section-actions {
			display: flex;
			gap: 7px
		}

		.collapse-toggle {
			font-size: 12px;
			color: var(--muted)
		}

		.section-content[hidden] {
			display: none
		}

		#pager {
			justify-content: flex-end;
			flex-wrap: wrap;
			padding: 2px 0
		}

		.page-nav {
			display: flex;
			align-items: center;
			border: 1px solid #43536d;
			border-radius: 7px;
			overflow: hidden;
			background: #202939
		}

		.page-nav button {
			border: 0;
			border-radius: 0;
			font-size: 22px;
			line-height: 1;
			padding: 4px 12px;
			min-width: 38px
		}

		.page-nav button+button {
			border-left: 1px solid #43536d
		}

		#page-label {
			min-width: 170px;
			padding: 0 10px;
			text-align: center;
			color: var(--muted);
			font-size: 12px;
			white-space: nowrap
		}

		.null-value {
			color: var(--muted);
			background: transparent;
			border: 1px dashed #536071;
			font-weight: 400
		}

		.empty-value {
			display: inline-block;
			min-width: 1px;
			padding: 0;
			background: transparent
		}

		.section-heading {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 3px 0;
			border: 0;
			background: transparent;
			color: var(--text);
			cursor: pointer
		}

		.section-heading:hover h2 {
			color: var(--accent)
		}

		.section-chevron {
			color: var(--muted);
			font-size: 18px;
			transition: transform .15s
		}

		.section-heading[aria-expanded="false"] .section-chevron {
			transform: rotate(-90deg)
		}

		#data-body tr {
			transition: background .12s
		}

		#data-body tr:hover td {
			background: #202c40
		}

		#data-head th[data-column] {
			cursor: pointer;
			user-select: none
		}

		#data-head th[data-column]:hover {
			background: #293b57
		}

		.sort-indicator {
			color: var(--accent);
			font-size: 12px;
			margin-left: 4px
		}

		#sort-note {
			margin: -4px 0 9px;
			color: var(--muted);
			font-size: 12px
		}
	</style>
</head>

<body>
	<main>
		<header>
			<div class="title">
				<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
					<path fill="#50ABF1"

				</svg>

				<h1>HTML Parquet Viewer</h1>
			</div>

			<p>A self-contained, offline Parquet file viewer. Your files never leave this browser.</p>
		</header>
		<div id="drop"><label class="button" for="file">Choose Parquet files</label><input id="file" type="file"
				multiple accept=".parquet,application/octet-stream">
			<div class="hint">Select one or more files, or drag and drop them here</div>
		</div>
		<p id="status" role="status" aria-live="polite"></p>
		<div id="tabs" role="tablist" aria-label="Open files"></div>
		<div id="summary" hidden></div>
		<p id="memory-note" hidden>Preview reads only the current page from the file. The full file is not expanded into
			memory.</p>
		<section class="collapsible" id="schema-section">
			<div class="section-title"><button class="section-heading" aria-expanded="true"
					aria-controls="schema-content">
					<h2>Schema</h2><span class="section-chevron" aria-hidden="true">⌄</span>
				</button></div>
			<div id="schema-content" class="section-content">
				<div class="scroll">
					<table>
						<thead>
							<tr>
								<th>Field</th>
								<th>Type</th>
								<th>Repetition</th>
							</tr>
						</thead>
						<tbody id="schema-body"></tbody>
					</table>
				</div>
			</div>
		</section>
		<section class="collapsible" id="preview-section">
			<div class="section-title"><button class="section-heading" aria-expanded="true"
					aria-controls="preview-content">
					<h2>Data preview</h2><span class="section-chevron" aria-hidden="true">⌄</span>
				</button>
				<div class="section-actions"><button id="copy-csv" title="Copy the current preview page as CSV">Copy
						CSV</button></div>
			</div>
			<p id="sort-note" hidden>Sorts this page only</p>
			<div id="preview-content" class="section-content">
				<div class="scroll">
					<table>
						<thead id="data-head"></thead>
						<tbody id="data-body"></tbody>
					</table>
				</div>
				<div id="pager" hidden>
					<div class="page-nav"><button id="prev" title="Previous page"
							aria-label="Previous page">‹</button><span id="page-label"></span><button id="next"
							title="Next page" aria-label="Next page">›</button></div><label>Page <input id="row-jump"
							type="number" min="1" step="1" inputmode="numeric"></label><label>Rows <select
							id="page-size">
							<option>50</option>
							<option selected>100</option>
							<option>250</option>
							<option>500</option>
							<option>1000</option>
						</select></label>
				</div>
			</div>
		</section>
